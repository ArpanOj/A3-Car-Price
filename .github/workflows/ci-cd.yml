name: CI-CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest

      - name: Run unit tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: arpanoj
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: arpanoj/a3-car-price:latest

    deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H bazooka.cs.ait.ac.th >> ~/.ssh/known_hosts
          ssh-keyscan -H ml.brain.cs.ait.ac.th >> ~/.ssh/known_hosts

      - name: Deploy to ml-brain through bazooka
        env:
          JUMP_PASSWORD: ${{ secrets.JUMP_PASSWORD }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          JUMP_HOST: ${{ secrets.JUMP_HOST }}
        run: |
          sshpass -p "$JUMP_PASSWORD" ssh \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ProxyCommand="sshpass -p '$JUMP_PASSWORD' ssh -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no -W %h:%p $SSH_USERNAME@$JUMP_HOST" \
            -i ~/.ssh/id_ed25519 \
            $SSH_USERNAME@ml.brain.cs.ait.ac.th \
            "cd ~/st127304-a3 && docker compose pull && docker compose up -d"